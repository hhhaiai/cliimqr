name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and package with Docker
        run: |
          tag="${GITHUB_REF_NAME#v}"
          build_number="${{ github.run_number }}"
          echo "==> Building cliimqr ${tag} (build ${build_number})"

          # 构建 Docker 镜像
          docker build \
            --build-arg "VERSION=${tag}" \
            --build-arg "BUILD=${build_number}" \
            -t cliimqr-builder .

          # 运行容器生成产物到 release/ 目录
          mkdir -p release
          docker run --rm \
            -v "$(pwd)/release:/out" \
            -e "VERSION=${tag}" \
            -e "BUILD=${build_number}" \
            cliimqr-builder

          # 将产物列表输出到 GITHUB_ENV
          echo "ASSETS=$(ls release/ | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false