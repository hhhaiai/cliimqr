name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, 386, arm64, arm]
        exclude:
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
          - goos: windows
            goarch: arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Run tests
        run: go test -race ./...

      - name: Build
        run: |
          tag="${GITHUB_REF_NAME#v}"
          os="${{ matrix.goos }}"
          arch="${{ matrix.goarch }}"
          ext=""
          [ "$os" = "windows" ] && ext=".exe"
          binary="cliimqr${ext}"

          ldflags="-s -w"
          [ -n "$tag" ] && ldflags="${ldflags} -X main.appVersion=${tag}"

          GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags="${ldflags}" -o "${binary}" .

          if [ "$os" = "windows" ]; then
            archive="cliimqr_${tag}_${os}_${arch}.zip"
            zip -q "${archive}" "${binary}"
          else
            archive="cliimqr_${tag}_${os}_${arch}.tar.gz"
            tar czf "${archive}" "${binary}"
          fi
          rm -f "${binary}"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${archive}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        id: build

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.archive }}
          generate_release_notes: true
          fail_on_unmatched_files: false